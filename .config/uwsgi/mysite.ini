[uwsgi]
home = /home/ubuntu/VENV/v_pro
chdir = /home/ubuntu/AI_portfolio/
module = portfolio.wsgi:application

uid = ubuntu
gid = ubuntu

# http = :8000   # runserver 용

socket = /tmp/mysite.sock
chmod-socket = 666
chown-socket = ubuntu:ubuntu

enable-threads = true
master = true
vacuum = true
pidfile = /tmp/mysite.pid
logto = /var/log/uwsgi/mysite/@(exec://date +%%Y-%%m-%%d).log
log-reopen = true